<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GTA: TAIPEI — 台北風雲</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #05070d; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  #boot {
    position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: radial-gradient(120% 100% at 50% 0%, #14203c 0%, #05070d 70%);
    color: #e8f4ff; font-family: "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
    transition: opacity .6s ease; letter-spacing: .08em;
  }
  #boot.hide { opacity: 0; pointer-events: none; }
  #boot h1 { margin: 0; font-size: 42px; font-weight: 900; letter-spacing: .18em;
    background: linear-gradient(180deg,#fff 0%,#7fd0ff 55%,#ff4f9a 130%);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  #boot .sub { font-size: 13px; color: #8fa9c4; letter-spacing: .3em; }
  #boot .bar { width: 260px; height: 3px; background: #1b2b45; border-radius: 3px; overflow: hidden; }
  #boot .bar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg,#35e0ff,#ff3d9a); transition: width .3s; }
  #boot .tip { font-size: 12px; color: #5f7793; }
</style>
</head>
<body>
<div id="app"></div>
<div id="boot">
  <h1>GTA: TAIPEI</h1>
  <div class="sub">台 北 風 雲</div>
  <div class="bar"><i id="bootbar"></i></div>
  <div class="tip" id="boottip">正在載入台北市…</div>
</div>
<script>window.__ERR=[];window.addEventListener('error',function(e){window.__ERR.push((e.error&&e.error.stack)||e.message);});</script>
<script src="vendor/three.min.js"></script>
<script src="src/config.js"></script>
<script src="src/utils.js"></script>
<script src="src/city.js"></script>
<script src="src/landmarks.js"></script>
<script src="src/vehicles.js"></script>
<script src="src/agents.js"></script>
<script src="src/hud.js"></script>
<script src="src/audio.js"></script>
<script src="src/game.js"></script>
</body>
</html>
